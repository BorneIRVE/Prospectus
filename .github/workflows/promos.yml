name: Promos hebdo (anti-crise)

on:
  schedule:
    # Chaque mardi à 06:00 UTC (08:00 en France l'été). cron : min h * * jour(2=mardi)
    - cron: "0 6 * * 2"
  workflow_dispatch:        # permet aussi un lancement manuel depuis l'onglet Actions

permissions:
  contents: write           # nécessaire pour committer promos.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scraper/requirements.txt

      - name: Lancer le scraper
        run: python scraper/anticrise.py

      - name: Committer les promos si elles ont changé
        run: |
          git config user.name  "promos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/promos.json data/promos-*.json
          if git diff --cached --quiet; then
            echo "Aucun changement de promos."
          else
            git commit -m "Promos du $(date +%F)"
            git push
          fi
